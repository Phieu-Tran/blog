name: Weekly Sync

on:
  schedule:
    # Mỗi thứ 2 lúc 23:00 UTC (6:00 sáng UTC+7)
    - cron: '0 23 * * 1'
  workflow_dispatch:
    inputs:
      max_auto_delete:
        description: "Maximum guarded local deletes for this manual run"
        required: false
        default: "20"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Sync all data
        env:
          MAL_USERNAME: ${{ vars.MAL_USERNAME }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_SESSION_ID: ${{ secrets.TMDB_SESSION_ID }}
          TMDB_ACCOUNT_ID: ${{ vars.TMDB_ACCOUNT_ID }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ vars.STEAM_ID }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          SYNC_DELETE_MISSING: "true"
          SYNC_MAX_AUTO_DELETE: ${{ github.event.inputs.max_auto_delete || '20' }}
          SYNC_REPORT_DIR: ".sync"
        run: |
          node src/scripts/sync-all.mjs
          node src/scripts/sync-imdb.mjs --enrich-existing
          npm run build

      - name: Add sync report summary
        if: always()
        run: |
          if [ -f .sync/sync-report.md ]; then
            cat .sync/sync-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No sync report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report
          path: .sync/
          if-no-files-found: ignore

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: weekly sync $(date +%Y-%m-%d)"
            git push
          fi
